<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYS 開放日 - 系統登入與註冊</title>
    <style>
        body { 
            font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .login-box, .register-box { 
            background: white; 
            padding: 35px 30px; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
            transition: 0.3s;
        }
        /* 預設隱藏註冊區塊 */
        .register-box { display: none; }
        
        h1 { font-size: 20px; color: #004080; margin-top: 0; margin-bottom: 20px; line-height: 1.4; }
        
        /* 表單樣式 */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .input-group input, .input-group select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
            font-size: 14px; box-sizing: border-box; transition: 0.2s; background: #fdfdfd;
        }
        .input-group input:focus, .input-group select:focus { border-color: #007bff; outline: none; background: #fff; }
        
        button { 
            width: 100%; padding: 12px; background-color: #007bff; color: white; 
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer; 
            font-weight: bold; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,123,255,0.2);
        }
        button:hover { background-color: #0056b3; transform: translateY(-1px); }
        
        .switch-link { 
            margin-top: 20px; font-size: 14px; color: #666; 
        }
        .switch-link a { 
            color: #007bff; text-decoration: none; font-weight: bold; cursor: pointer; 
        }
        .switch-link a:hover { text-decoration: underline; }
        
        .error-msg { color: #dc3545; font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px; }
        .env-badge { font-size: 11px; color: #888; margin-top: 20px; border-top: 1px dashed #eee; padding-top: 15px; }
    </style>
</head>
<body>

<!-- ================= 登入區塊 ================= -->
<div class="login-box" id="loginBox">
    <h1>明愛元朗陳震夏中學<br>開放日 AI 體驗</h1>
    <div id="loginError" class="error-msg">帳號或密碼錯誤</div>
    
    <div class="input-group">
        <input type="text" id="loginUsername" placeholder="電子郵件 (或管理員帳號)">
    </div>
    <div class="input-group">
        <input type="password" id="loginPassword" placeholder="聯絡電話 (或管理員密碼)">
    </div>
    
    <button onclick="handleLogin()">安全登入</button>
    
    <div class="switch-link">
        還沒有帳號？ <a onclick="toggleView('register')">立即自行註冊</a>
    </div>
    
    <div class="env-badge" id="envBadgeLogin">系統連線中...</div>
</div>

<!-- ================= 註冊區塊 ================= -->
<div class="register-box" id="registerBox">
    <h1 style="margin-bottom: 15px;">📝 參與者自行註冊</h1>
    <div id="regError" class="error-msg">請填寫完整資料</div>
    
    <div class="input-group">
        <label>姓名 <span style="color:red">*</span></label>
        <input type="text" id="regName" placeholder="例如：陳大文">
    </div>
    <div class="input-group">
        <label>就讀小學 <span style="color:red">*</span></label>
        <select id="regSchool" class="school-select-list"></select>
    </div>
    <div class="input-group">
        <label>就讀年級</label>
        <select id="regGrade">
            <option value="小六">小六</option>
            <option value="小五">小五</option>
            <option value="小四">小四</option>
            <option value="小三">小三</option>
            <option value="其他">其他</option>
        </select>
    </div>
    <div class="input-group">
        <label>電子郵件 (登入帳號) <span style="color:red">*</span></label>
        <input type="email" id="regEmail" placeholder="example@email.com">
    </div>
    <div class="input-group">
        <label>聯絡電話 (登入密碼) <span style="color:red">*</span></label>
        <input type="tel" id="regPhone" placeholder="例如：91234567">
    </div>
    
    <button style="background-color: #28a745; box-shadow: 0 4px 6px rgba(40,167,69,0.2);" onclick="handleRegister()">確認註冊並登入</button>
    
    <div class="switch-link">
        已經有帳號了？ <a onclick="toggleView('login')">返回登入</a>
    </div>
</div>

<script>
    // --- 系統安全與環境偵測 ---
    const isLocalFile = window.location.protocol === 'file:';
    const isSecureCtx = !!(window.crypto && window.crypto.subtle);

    // --- 預設小學資料庫 (與後台保持一致) ---
    const districtsSchools = {
        "元朗區": ["光明學校", "鐘聲學校", "元朗公立中學校友會小學", "南元朗官立小學", "光明英來學校", "元朗商會小學", "聖公會靈愛小學", "佛教陳榮根紀念學校", "基督教宣道會徐澤林紀念小學"],
        "天水圍區": ["樂善堂梁銶琚學校", "伊利沙伯中學舊生會小學", "天水圍官立小學", "東華三院潮陽百欣小學", "金巴崙長老會耀道小學", "順德聯誼總會伍冕端小學", "宣道會葉紹蔭紀念小學", "香港青年協會李兆基小學", "元朗寶覺小學"],
        "屯門區": ["保良局志豪小學", "順德聯誼總會何日東小學", "順德聯誼總會胡少渠紀念小學", "仁愛堂劉皇發夫人小學", "博愛醫院歷屆總理聯誼會鄭任安夫人學校", "屯門官立小學", "世界龍岡學校劉德容紀念小學", "保良局莊啟程第二小學", "青山天主教小學"],
        "其他地區 / 其他學校": ["其他小學"]
    };

    window.onload = function() {
        // 設定環境標籤
        const badge = document.getElementById('envBadgeLogin');
        if (isLocalFile) {
            badge.innerHTML = "⚠️ 本地演示模式：已同步共享資料庫"; badge.style.color = "#ff9800";
        } else if (isSecureCtx) {
            badge.innerHTML = "🔒 系統安全連線中"; badge.style.color = "#28a745";
        }
        
        // 初始化下拉選單
        const select = document.getElementById('regSchool');
        select.innerHTML = '<option value="">-- 請選擇就讀小學 --</option>';
        for (const [district, schools] of Object.entries(districtsSchools)) {
            const group = document.createElement('optgroup'); group.label = district;
            schools.forEach(school => {
                const opt = document.createElement('option'); opt.value = school; opt.textContent = school;
                group.appendChild(opt);
            });
            select.appendChild(group);
        }
    };

    // --- 畫面切換邏輯 ---
    function toggleView(view) {
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('regError').style.display = 'none';
        if (view === 'register') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('registerBox').style.display = 'block';
        } else {
            document.getElementById('registerBox').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
        }
    }

    // --- 讀取或初始化資料庫 ---
    function getDatabase() {
        const storedDb = localStorage.getItem('cys_users_database');
        if (storedDb) return JSON.parse(storedDb);
        const defaultUsers = [
            { id: 1, name: "陳大文", school: "光明學校", grade: "小六", email: "chan@example.com", phone: "91234567", status: "pending", scores: [1,1,1,1,1] }
        ];
        localStorage.setItem('cys_users_database', JSON.stringify(defaultUsers));
        return defaultUsers;
    }

    // --- SHA-256 加密 ---
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // =====================================
    // 1. 登入邏輯
    // =====================================
    async function handleLogin() {
        const user = document.getElementById('loginUsername').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();
        const errorDiv = document.getElementById('loginError');
        errorDiv.style.display = 'none';

        if (!user || !pass) { errorDiv.innerText = '請輸入電郵與電話號碼'; errorDiv.style.display = 'block'; return; }

        // 管理員驗證
        const targetUsername = "CYS"; const targetPassword = "cys24755432";
        const targetUserHash = "68c92b23a968600d3d526786ff762b339433dbefd1641a995e8e244bdf9f4306"; 
        const targetPassHash = "c371236ca7e4fa6d014de1ecf24b11dffdfccef9b2abcac1c7384c11734bdcc2"; 

        let isAdmin = false;
        if (user.toUpperCase() === targetUsername && pass === targetPassword) {
            isAdmin = true;
        } else if (isSecureCtx) {
            try { if (await sha256(user) === targetUserHash && await sha256(pass) === targetPassHash) isAdmin = true; } catch(e){}
        }

        if (isAdmin) {
            sessionStorage.setItem('admin_token', 'secure_session_active'); localStorage.setItem('admin_token_backup', 'secure_session_active');
            window.location.href = 'admin.html';
        } else {
            // 學生登入配對
            const activeDatabase = getDatabase();
            const foundUser = activeDatabase.find(u => String(u.email).trim().toLowerCase() === user.toLowerCase() && String(u.phone).trim() === pass);

            if (foundUser) {
                sessionStorage.setItem('user_email', foundUser.email); sessionStorage.setItem('user_phone', foundUser.phone);
                window.location.href = 'user.html';
            } else {
                errorDiv.innerText = '找不到此帳號，請確認輸入正確或點擊下方註冊。'; errorDiv.style.display = 'block';
            }
        }
    }

    // =====================================
    // 2. 自行註冊邏輯
    // =====================================
    function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const school = document.getElementById('regSchool').value;
        const grade = document.getElementById('regGrade').value;
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const errorDiv = document.getElementById('regError');
        errorDiv.style.display = 'none';

        // 基礎驗證
        if (!name || !school || !email || !phone) {
            errorDiv.innerText = '請填寫所有帶有 * 的必填欄位';
            errorDiv.style.display = 'block';
            return;
        }
        
        // 取得目前資料庫
        const activeDatabase = getDatabase();

        // 檢查是否已經被註冊過 (防撞號)
        const isExist = activeDatabase.some(u => u.email.toLowerCase() === email.toLowerCase() || u.phone === phone);
        if (isExist) {
            errorDiv.innerText = '此電郵或電話號碼已被註冊過！請直接登入。';
            errorDiv.style.display = 'block';
            return;
        }

        // 建立新使用者檔案 (預設狀態：pending登記未報到，分數皆為 1)
        const newUser = {
            id: Date.now(),
            name: name,
            school: school,
            grade: grade,
            email: email,
            phone: phone,
            status: 'pending', 
            scores: [1, 1, 1, 1, 1]
        };

        // 寫入資料庫
        activeDatabase.unshift(newUser);
        localStorage.setItem('cys_users_database', JSON.stringify(activeDatabase));

        alert(`🎉 註冊成功，歡迎加入開放日體驗！\n\n您的登入帳號是：${email}\n您的登入密碼是：${phone}`);

        // 自動將憑證存入並登入跳轉至 user.html
        sessionStorage.setItem('user_email', email);
        sessionStorage.setItem('user_phone', phone);
        window.location.href = 'user.html';
    }
</script>
</body>
</html>
