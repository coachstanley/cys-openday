<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>明愛元朗陳震夏中學薈藝博文升中資訊日 - 登入與註冊</title>
    
    <!-- 引入 Firebase v8 CDN (最穩定、不需編譯，相容各大手機) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-box, .register-box { background: white; padding: 35px 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .register-box { display: none; }
        h1 { font-size: 20px; color: #004080; margin-top: 0; margin-bottom: 20px; line-height: 1.4; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,123,255,0.2); }
        button:hover { background-color: #0056b3; }
        .switch-link { margin-top: 20px; font-size: 14px; color: #666; }
        .switch-link a { color: #007bff; text-decoration: none; font-weight: bold; cursor: pointer; }
        .error-msg { color: #dc3545; font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px; }
        .env-badge { font-size: 11px; color: #888; margin-top: 20px; border-top: 1px dashed #eee; padding-top: 15px; }
    </style>
</head>
<body>

<!-- ================= 登入區塊 ================= -->
<div class="login-box" id="loginBox">
    <h1>明愛元朗陳震夏中學<br>薈藝博文升中資訊日</h1>
    <div id="loginError" class="error-msg">帳號或密碼錯誤</div>
    
    <div class="input-group">
        <input type="text" id="loginUsername" placeholder="登記電子郵件 (或管理員帳號)">
    </div>
    <div class="input-group">
        <input type="password" id="loginPassword" placeholder="登記聯絡電話 (或管理員密碼)">
    </div>
    
    <button onclick="handleLogin()">安全登入</button>
    <div class="switch-link">還沒有帳號？ <a onclick="toggleView('register')">立即自行註冊</a></div>
    <div class="env-badge" id="envBadge" style="color: #28a745;">☁️ 系統已成功啟用 Firebase 即時雲端儲存</div>
</div>

<!-- ================= 註冊區塊 ================= -->
<div class="register-box" id="registerBox">
    <h1 style="margin-bottom: 15px;">📝 參與者自行註冊</h1>
    <div id="regError" class="error-msg"></div>
    
    <div class="input-group">
        <label>姓名 <span style="color:red">*</span></label>
        <input type="text" id="regName" placeholder="例如：陳大文">
    </div>
    <div class="input-group">
        <label>就讀小學 <span style="color:red">*</span></label>
        <select id="regSchool" class="school-select-list"></select>
    </div>
    <div class="input-group">
        <label>就讀年級</label>
        <select id="regGrade">
            <option value="小六">小六</option>
            <option value="小五">小五</option>
            <option value="小四">小四</option>
            <option value="小三">小三</option>
            <option value="其他">其他</option>
        </select>
    </div>
    <div class="input-group">
        <label>電子郵件 (登入帳號) <span style="color:red">*</span></label>
        <input type="email" id="regEmail" placeholder="example@email.com">
    </div>
    <div class="input-group">
        <label>聯絡電話 (登入密碼) <span style="color:red">*</span></label>
        <input type="tel" id="regPhone" placeholder="例如：91234567">
    </div>
    
    <button style="background-color: #28a745;" id="regBtn" onclick="handleRegister()">確認註冊並自動登入</button>
    <div class="switch-link">已經有帳號了？ <a onclick="toggleView('login')">返回登入</a></div>
</div>

<script>
    // 🌟 帶入您的專屬 Firebase 金鑰設定 🌟
    const firebaseConfig = {
        apiKey: "AIzaSyDyfe-ItBWTeJ_6aZWjz4D8FQwWJ8XnLw4",
        authDomain: "cys-openday.firebaseapp.com",
        projectId: "cys-openday",
        storageBucket: "cys-openday.firebasestorage.app",
        messagingSenderId: "332588640232",
        appId: "1:332588640232:web:c17dd8d7d443d2d825265d"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const districtsSchools = {
        "元朗區": ["光明學校", "鐘聲學校", "元朗公立中學校友會小學", "南元朗官立小學", "光明英來學校", "元朗商會小學"],
        "天水圍區": ["樂善堂梁銶琚學校", "伊利沙伯中學舊生會小學", "天水圍官立小學", "東華三院潮陽百欣小學"],
        "屯門區": ["保良局志豪小學", "順德聯誼總會何日東小學", "順德聯誼總會胡少渠紀念小學"],
        "其他地區 / 其他學校": ["其他小學"]
    };

    window.onload = function() {
        const select = document.getElementById('regSchool');
        select.innerHTML = '<option value="">-- 請選擇就讀小學 --</option>';
        for (const [district, schools] of Object.entries(districtsSchools)) {
            const group = document.createElement('optgroup'); group.label = district;
            schools.forEach(school => {
                const opt = document.createElement('option'); opt.value = school; opt.textContent = school;
                group.appendChild(opt);
            });
            select.appendChild(group);
        }
    };

    function toggleView(view) {
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('regError').style.display = 'none';
        if (view === 'register') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('registerBox').style.display = 'block';
        } else {
            document.getElementById('registerBox').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
        }
    }

    // 1. 雲端登入配對
    async function handleLogin() {
        const emailInput = document.getElementById('loginUsername').value.trim();
        const phoneInput = document.getElementById('loginPassword').value.trim();
        const errorDiv = document.getElementById('loginError');
        errorDiv.style.display = 'none';

        if (!emailInput || !phoneInput) {
            errorDiv.innerText = '請輸入電子郵件與電話號碼'; errorDiv.style.display = 'block'; return;
        }

        // 管理員帳密驗證
        if (emailInput.toUpperCase() === "CYS" && phoneInput === "cys24755432") {
            sessionStorage.setItem('admin_token', 'secure_session_active');
            localStorage.setItem('admin_token_backup', 'secure_session_active');
            window.location.href = 'admin.html';
            return;
        }

        // 從 Firebase 搜尋對應的使用者文件
        db.collection("users").doc(emailInput.toLowerCase()).get().then((doc) => {
            if (doc.exists) {
                const userData = doc.data();
                if (String(userData.phone).trim() === phoneInput) {
                    // 登入成功，將憑證寫入會話
                    sessionStorage.setItem('user_email', userData.email);
                    sessionStorage.setItem('user_phone', userData.phone);
                    window.location.href = 'user.html';
                } else {
                    errorDiv.innerText = '電話號碼不正確！'; errorDiv.style.display = 'block';
                }
            } else {
                errorDiv.innerText = '找不到此登記電郵，請先點擊下方自行註冊！'; errorDiv.style.display = 'block';
            }
        }).catch((error) => {
            console.error("Firebase 讀取錯誤:", error);
            errorDiv.innerText = '連線雲端資料庫超時，請檢查網絡連線。'; errorDiv.style.display = 'block';
        });
    }

    // 2. 雲端註冊
    function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const school = document.getElementById('regSchool').value;
        const grade = document.getElementById('regGrade').value;
        const email = document.getElementById('regEmail').value.trim().toLowerCase();
        const phone = document.getElementById('regPhone').value.trim();
        const errorDiv = document.getElementById('regError');
        const regBtn = document.getElementById('regBtn');
        
        errorDiv.style.display = 'none';

        if (!name || !school || !email || !phone) {
            errorDiv.innerText = '請填寫所有必填欄位！'; errorDiv.style.display = 'block'; return;
        }

        regBtn.disabled = true;
        regBtn.innerText = "正在連線雲端儲存中...";

        // 檢查該 Email 是否已被註冊
        db.collection("users").doc(email).get().then((doc) => {
            if (doc.exists) {
                errorDiv.innerText = '此電子郵件已被註冊過！請直接返回登入。';
                errorDiv.style.display = 'block';
                regBtn.disabled = false;
                regBtn.innerText = "確認註冊並自動登入";
            } else {
                // 建構正確的新手資料結構 (scores 為空陣列)
                const newUser = {
                    id: Date.now(),
                    name: name,
                    school: school,
                    grade: grade,
                    email: email,
                    phone: phone,
                    status: 'pending',
                    scores: [[],[],[],[],[]]
                };

                // 寫入 Firebase Cloud Firestore
                db.collection("users").doc(email).set(newUser).then(() => {
                    alert(`🎉 註冊成功，歡迎參與資訊日！`);
                    sessionStorage.setItem('user_email', email);
                    sessionStorage.setItem('user_phone', phone);
                    window.location.href = 'user.html';
                }).catch((err) => {
                    alert("註冊寫入雲端失敗，請聯絡接待處工作人員。");
                    regBtn.disabled = false;
                    regBtn.innerText = "確認註冊並自動登入";
                });
            }
        });
    }
</script>
</body>
</html>
